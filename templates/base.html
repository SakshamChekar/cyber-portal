<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>{% block title %}Cyber Portal{% endblock %}</title>
</head>

<body>

    <!-- Navbar (Sticky) -->
    <div class="sticky-top">
        {% include 'navbar.html' %}
    </div>

    <!-- Main Content -->
    <main class="container py-5" style="min-height: 80vh;">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-5">
        <div class="container text-center py-4">

            <h5 class="fw-bold mb-1">Cyber Security Portal</h5>
            <p class="text-muted mb-3">Stay safe in the digital world</p>

            <!-- Social -->
            <div class="d-flex justify-content-center gap-3 mb-3">
                <a href="#" class="footer-icon"><i class="bi bi-twitter"></i></a>
                <a href="#" class="footer-icon"><i class="bi bi-instagram"></i></a>
                <a href="#" class="footer-icon"><i class="bi bi-envelope"></i></a>
            </div>

            <small class="text-muted">
                &copy; 2025 Cyber Portal. All rights reserved.
            </small>

        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
