{% extends 'base.html' %}

{% block title %}Contact{% endblock %}

{% block content %}

<div class="container my-5">

    <!-- Heading -->
    <div class="text-center mb-5">
        <h2 class="fw-bold">Get in Touch</h2>
        <p class="text-muted">Have questions or feedback? We'd love to hear from you.</p>
    </div>

    <div class="row g-4">

        <!-- Contact Info -->
        <div class="col-md-5">
            <div class="card p-4 h-100">

                <h4 class="mb-4 fw-semibold">Contact Information</h4>

                <div class="d-flex align-items-center mb-3">
                    <i class="bi bi-telephone-fill contact-icon"></i>
                    <div>
                        <small class="text-muted">Phone</small><br>
                        <strong>+91-1234567890</strong>
                    </div>
                </div>

                <div class="d-flex align-items-center mb-3">
                    <i class="bi bi-envelope-fill contact-icon"></i>
                    <div>
                        <small class="text-muted">Email</small><br>
                        <strong>official@cyberportal.com</strong>
                    </div>
                </div>

                <div class="d-flex align-items-center mb-3">
                    <i class="bi bi-geo-alt-fill contact-icon"></i>
                    <div>
                        <small class="text-muted">Location</small><br>
                        <strong>Mumbai, India</strong>
                    </div>
                </div>

                <!-- Social -->
                <h6 class="mt-4 text-muted">Follow Us</h6>
                <div class="d-flex gap-3 mt-2">
                    <a href="#" class="social-icon"><i class="bi bi-twitter"></i></a>
                    <a href="#" class="social-icon"><i class="bi bi-linkedin"></i></a>
                    <a href="#" class="social-icon"><i class="bi bi-instagram"></i></a>
                </div>

            </div>
        </div>

        <!-- Contact Form -->
        <div class="col-md-7">
            <div class="card p-4 h-100">

                <h4 class="mb-4 fw-semibold">Send a Message</h4>

                <form>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Your Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Your Email</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Message</label>
                        <textarea class="form-control" rows="4" placeholder="Type your message"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Send Message
                    </button>

                </form>

            </div>
        </div>

    </div>

</div>

{% endblock %}
